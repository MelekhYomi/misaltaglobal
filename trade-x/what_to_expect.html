<!-- Faithful clone of the Trade X "what to expect" prototype
     (hisbu6mcmt22o.kimi.page). Styles, scripts and photos are served
     locally from this site: ./assets/index.css, ./assets/index.js and
     /<name>.jpg|png at the site root. -->
<link rel="stylesheet" href="assets/index.css">
</head>
<body>
<div id="root"></div>

<script type="module" src="assets/index.js"></script>
<script>
/* Wire the prototype's CTAs into the live Misalta flow once the app mounts.
   Runs a few passes because the SPA renders asynchronously. */
(function () {
  var patch = function () {
    document.querySelectorAll("#root a").forEach(function (a) {
      var t = (a.textContent || "").trim().toLowerCase();
      if (t.indexOf("early access") > -1 || t.indexOf("request a demo") > -1 || t.indexOf("request demo") > -1 || t.indexOf("join the pilot") > -1) {
        a.setAttribute("href", "../trade-x.html#early-access");
      }
      if (a.getAttribute("href") === "/") a.setAttribute("href", "../index.html");
      if (t.indexOf("privacy") > -1) a.setAttribute("href", "../privacy.html");
      if (t.indexOf("contact") > -1 && (a.getAttribute("href") || "").indexOf("mailto") === -1) {
        a.setAttribute("href", "../contact.html");
      }
    });
    /* CTAs rendered as buttons: make them navigate to the real form. */
    document.querySelectorAll("#root button").forEach(function (b) {
      var t = (b.textContent || "").trim().toLowerCase();
      if ((t.indexOf("early access") > -1 || t.indexOf("demo") > -1 || t.indexOf("pilot") > -1) && !b.dataset.wired) {
        b.dataset.wired = "1";
        b.style.cursor = "pointer";
        b.addEventListener("click", function () { location.href = "../trade-x.html#early-access"; });
      }
    });
    /* Footer year, patched via text nodes (safe for the SPA's listeners). */
    var walker = document.createTreeWalker(document.getElementById("root"), NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      if (walker.currentNode.nodeValue.indexOf("© 2025") > -1) {
        walker.currentNode.nodeValue = walker.currentNode.nodeValue.replace("© 2025", "© 2026");
      }
    }
  };
  var tries = 0, timer = setInterval(function () {
    patch();
    if (document.querySelector("#root section") && document.querySelector("#root h2") && ++tries > 4) patch();
    if (tries > 25) clearInterval(timer);
  }, 300);
})();
</script>
</body>
</html>
